# sbom-audit rule extensions for gitleaks 8.x. The built-in rules (anthropic, openai, gcp-api-key,
# aws, azure, github-*, private-key, jwt, stripe-access-token, slack-webhook-url, discord-*,
# npm-access-token, sendgrid, twilio, huggingface, ...) stay active; only what they lack is added.
title = "sbom-audit"

[extend]
useDefault = true

# Obvious placeholders are ignored (case-insensitive). The target is the captured secret, not the whole
# match: a key *name* such as SUPABASE_JWT_SECRET_EXAMPLE_APP or a path like database.example.env
# can then never hide a real value next to it. Only a value that itself reads example, changeme or
# xxxxxxxx is dropped, and a URL password that is literally `password` (`scheme://user:password@host`).
#
# Rules without a distinctive prefix bind their keyword to an assignment (`KEY=v`, `"key": "v"`,
# `key: v`, `key = "v"`, up to 20 identifier characters after the keyword, same line) and capture
# the value with secretGroup, so a hash or token elsewhere in a file that merely mentions the
# provider is not reported.
[allowlist]
description = "Obvious placeholders"
regexTarget = "secret"
regexes = [
  '''(?i)example''',
  '''(?i)changeme''',
  '''(?i)xxxxxxxx''',
  '''(?i)^password$''',
]

[[rules]]
id = "supabase-secret-key"
description = "Supabase secret API key (service-role equivalent)"
regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]
tags = ["sbom-audit"]

[[rules]]
id = "supabase-publishable-key"
description = "Supabase publishable API key (public by design)"
regex = '''sb_publishable_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_publishable_"]
tags = ["sbom-audit"]

[[rules]]
id = "supabase-jwt-secret"
description = "Supabase JWT secret (signs every project token)"
regex = '''(?i)jwt_secret[\w.-]{0,20}["']?[ \t]*[:=][ \t]*["']?([A-Za-z0-9+/_-]{32,})'''
secretGroup = 1
entropy = 3.5
keywords = ["jwt_secret", "supabase_jwt_secret"]
tags = ["sbom-audit"]

[[rules]]
id = "revenuecat-secret-key"
description = "RevenueCat secret API key"
regex = '''sk_[A-Za-z0-9]{24,}'''
keywords = ["revenuecat"]
tags = ["sbom-audit"]

[[rules]]
id = "revenuecat-public-sdk-key"
description = "RevenueCat public SDK key (shipped in apps)"
regex = '''\b(?:appl|goog|amzn|strp|test)_[A-Za-z0-9]{20,}'''
entropy = 3.0
keywords = ["appl_", "goog_", "amzn_", "strp_", "test_"]
tags = ["sbom-audit"]

[[rules]]
id = "fal-key"
description = "Fal.ai API key"
regex = '''[0-9a-f]{8}-[0-9a-f-]{27}:[0-9a-f]{32}'''
entropy = 3.0
keywords = ["fal_", "fal-", "FAL_KEY", "fal.ai"]
tags = ["sbom-audit"]

[[rules]]
id = "assemblyai-api-key"
description = "AssemblyAI API key"
regex = '''(?i)assemblyai[\w.-]{0,20}["']?[ \t]*[:=][ \t]*["']?([0-9a-f]{32})\b'''
secretGroup = 1
entropy = 3.0
keywords = ["assemblyai"]
tags = ["sbom-audit"]

[[rules]]
id = "dataforseo-credentials"
description = "DataForSEO API credentials (base64 login:password)"
regex = '''(?i)dataforseo[\w.-]{0,20}["']?[ \t]*[:=][ \t]*["']?([A-Za-z0-9+/]{24,}={0,2})'''
secretGroup = 1
entropy = 3.5
keywords = ["dataforseo"]
tags = ["sbom-audit"]

[[rules]]
id = "expo-access-token"
description = "Expo access token"
regex = '''(?i)expo_token[\w.-]{0,20}["']?[ \t]*[:=][ \t]*["']?([A-Za-z0-9_-]{30,})'''
secretGroup = 1
entropy = 3.5
keywords = ["expo_token"]
tags = ["sbom-audit"]

[[rules]]
id = "hetzner-api-token"
description = "Hetzner Cloud API token"
regex = '''(?i)(?:hetzner|hcloud)[\w.-]{0,20}["']?[ \t]*[:=][ \t]*["']?([A-Za-z0-9]{64})\b'''
secretGroup = 1
entropy = 3.5
keywords = ["hetzner", "hcloud"]
tags = ["sbom-audit"]

[[rules]]
id = "contabo-client-secret"
description = "Contabo API client secret"
regex = '''(?i)contabo[\w.-]{0,20}["']?[ \t]*[:=][ \t]*["']?([A-Za-z0-9]{20,})'''
secretGroup = 1
entropy = 3.0
keywords = ["contabo"]
tags = ["sbom-audit"]

[[rules]]
id = "inngest-signing-key"
description = "Inngest signing key"
regex = '''signkey-(?:prod|test|branch)-[0-9a-f]{64}'''
keywords = ["signkey-"]
tags = ["sbom-audit"]

[[rules]]
id = "database-url-password"
description = "Database connection URL with an embedded password"
regex = '''(?:postgres|postgresql|mysql|mongodb(?:\+srv)?|redis|rediss)://[^:/\s]+:([^@\s]{4,})@'''
secretGroup = 1
keywords = ["postgres", "mysql", "mongodb", "redis"]
tags = ["sbom-audit"]

[[rules]]
id = "docker-pat"
description = "Docker Hub personal access token"
regex = '''dckr_pat_[A-Za-z0-9_-]{20,}'''
keywords = ["dckr_pat_"]
tags = ["sbom-audit"]
