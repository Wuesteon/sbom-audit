# Blast-radius classes for secret findings, keyed by gitleaks rule id (built-in and custom).
#   A  owns the platform: rotate before anything else
#   B  costs money or data
#   C  public by design or test
# Rules not listed are class B, provider "generic". classify.py refines four cases by value or path:
#   jwt, jwt-base64        decoded `role` claim (service_role A, anon C, other Supabase or foreign B)
#   stripe-access-token    sk_live / rk_live A, sk_test / rk_test C
#   gcp-api-key            B, but C when the file path contains "firebase" (web config is public)
[classes]
A = [
  "supabase-secret-key", "supabase-jwt-secret",
  "stripe-access-token",
  "github-pat", "github-fine-grained-pat", "github-oauth", "github-app-token", "github-refresh-token",
  "aws-access-token", "azure-ad-client-secret",
  "private-key", "age-secret-key",
  "npm-access-token", "docker-pat", "pypi-upload-token", "rubygems-api-token",
  "revenuecat-secret-key", "database-url-password",
  "hetzner-api-token", "contabo-client-secret",
]
B = [
  "anthropic-api-key", "anthropic-admin-api-key", "openai-api-key", "gcp-api-key",
  "huggingface-access-token", "huggingface-organization-api-token", "cohere-api-token", "perplexity-api-key",
  "aws-amazon-bedrock-api-key-long-lived", "aws-amazon-bedrock-api-key-short-lived",
  "fal-key", "assemblyai-api-key", "dataforseo-credentials", "expo-access-token",
  "sendgrid-api-token", "twilio-api-key",
  "slack-webhook-url", "discord-api-token", "discord-client-secret",
  "inngest-signing-key",
  "jwt", "jwt-base64", "generic-api-key",
]
C = [
  "supabase-publishable-key", "revenuecat-public-sdk-key", "discord-client-id",
]

# packages: names whose presence in a project's inventory means "this project also uses the provider".
[providers.supabase]
name = "Supabase"
hint = "Dashboard > Project Settings > API Keys: roll the key (the JWT secret under JWT Keys invalidates every issued token), then redeploy functions and clients."
packages = ["@supabase/supabase-js", "supabase"]

[providers.stripe]
name = "Stripe"
hint = "Dashboard > Developers > API keys: roll the secret key (set an expiry on the old one), update webhooks and servers."
packages = ["stripe", "@stripe/stripe-js"]

[providers.github]
name = "GitHub"
hint = "github.com > Settings > Developer settings: revoke the token, then check Settings > Security log for use since the exposure."
packages = ["@octokit/rest", "octokit", "PyGithub"]

[providers.aws]
name = "AWS"
hint = "IAM console: deactivate and delete the access key, create a new one, review CloudTrail for use since the exposure."
packages = ["aws-sdk", "@aws-sdk/client-s3", "boto3"]

[providers.gcp]
name = "Google Cloud / Gemini"
hint = "Google Cloud console > APIs & Services > Credentials (or AI Studio for Gemini keys): delete the key, create a restricted one."
packages = ["@google/generative-ai", "@google/genai", "google-generativeai", "firebase"]

[providers.azure]
name = "Azure"
hint = "Entra ID > App registrations > Certificates & secrets: delete the secret, create a new one, review sign-in logs."
packages = ["@azure/identity", "azure-identity"]

[providers.revenuecat]
name = "RevenueCat"
hint = "RevenueCat dashboard > Project settings > API keys: revoke the secret key and create a new one, update the server."
packages = ["react-native-purchases", "purchases-ios"]

[providers.fal]
name = "Fal.ai"
hint = "fal.ai dashboard > Keys: delete the key and create a new one."
packages = ["@fal-ai/client", "fal-client"]

[providers.assemblyai]
name = "AssemblyAI"
hint = "AssemblyAI dashboard > API keys: rotate the key."
packages = ["assemblyai"]

[providers.dataforseo]
name = "DataForSEO"
hint = "DataForSEO dashboard > API access: change the API password, which invalidates the base64 credentials."
packages = []

[providers.expo]
name = "Expo"
hint = "expo.dev > Account settings > Access tokens: revoke the token and create a new one for CI."
packages = ["expo"]

[providers.hetzner]
name = "Hetzner Cloud"
hint = "Hetzner Cloud console > Security > API tokens: delete the token and create a new one, check server and firewall changes."
packages = ["hcloud"]

[providers.contabo]
name = "Contabo"
hint = "Contabo customer panel > API: reset the client secret (and the API password if it was exposed too)."
packages = []

[providers.inngest]
name = "Inngest"
hint = "Inngest dashboard > Manage > Signing key: rotate the signing key and update the deployment."
packages = ["inngest"]

[providers.docker]
name = "Docker Hub"
hint = "Docker Hub > Account settings > Personal access tokens: delete the token and create a new one."
packages = []

[providers.npm]
name = "npm"
hint = "npmjs.com > Access Tokens: revoke the token, create a granular one, check recent package publishes."
packages = []

[providers.database]
name = "Database"
hint = "Change the database user's password at the host (or create a new user), update the connection string everywhere it is used."
packages = ["pg", "postgres", "mysql2", "ioredis", "redis", "mongodb", "psycopg2", "asyncpg"]

[providers.private-key]
name = "Private key"
hint = "Generate a new key pair, replace the public key on every server or service that trusts it, remove the old one."
packages = []

[providers.anthropic]
name = "Anthropic"
hint = "console.anthropic.com > Settings > API keys: delete the key and create a new one, check usage for the exposure window."
packages = ["@anthropic-ai/sdk", "anthropic"]

[providers.openai]
name = "OpenAI"
hint = "platform.openai.com > API keys: revoke the key and create a new one, check the usage dashboard."
packages = ["openai"]

[providers.slack]
name = "Slack"
hint = "api.slack.com/apps > your app: regenerate the webhook URL or reinstall the app to rotate the bot or user token."
packages = ["@slack/web-api", "@slack/bolt", "slack_sdk"]

[providers.generic]
name = "Unknown provider"
hint = "Identify the issuing service from the file and key name, revoke the credential there and create a new one."
packages = []

# Rule id -> provider. Rules not listed here belong to "generic".
[rule_providers]
