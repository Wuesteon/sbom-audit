# Tests and plugin validation on every push and pull request; a GitHub release for every
# `sbom-audit--v<version>` tag (created by `claude plugin tag --push`). Evals are run by hand
# before a release (see CONTRIBUTING.md); they need a Claude login and
# are not run here. No repository secrets are needed: the release job uses the built-in token.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["sbom-audit--v*"]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # from gitleaks_8.30.1_checksums.txt of the v8.30.1 GitHub release
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  CLAUDE_CODE_VERSION: "2.1.319"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Configure git for the fixture repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Unit tests (the secrets redaction test runs because gitleaks is installed)
        run: python3 -m unittest discover -s tests -t .

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate the plugin with the directory profile (no API key needed)
        run: claude plugin validate --strict --profile directory plugin

      - name: Validate the marketplace
        run: claude plugin validate --strict .

  release:
    if: startsWith(github.ref, 'refs/tags/sbom-audit--v')
    needs: [test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#sbom-audit--v}"
          awk -v v="$version" '
            index($0, "## " v " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "no CHANGELOG.md section for $version"; exit 1; }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "sbom-audit ${GITHUB_REF_NAME#sbom-audit--v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
